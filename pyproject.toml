[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smeta-rag"
version = "0.2.0"
description = "Smeta RAG: gen_rag (гибридный retrieval + rerank) и общая библиотека shared (парсеры, метаданные чанков)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "SmetaGPT" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "gen_rag*"]
exclude = ["archive*", "smeta_rag_env*"]
