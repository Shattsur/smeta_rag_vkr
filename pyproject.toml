[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smeta-rag"
version = "0.2.0"
description = "Monorepo для сметных RAG-систем: gen_rag (гибридный retrieval + rerank) и graph_rag (графовый RAG)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "SmetaGPT" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "gen_rag*", "graph_rag*"]
exclude = ["archive*", "smeta_rag_env*"]
